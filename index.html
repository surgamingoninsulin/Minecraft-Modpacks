<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sur Gaming On Insulin Minecraft modpacks - curated releases, install guide, and updates.">
    <title>Sur Gaming On Insulin - Minecraft Modpacks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <main class="page-shell">
        <section id="hero" class="section hero reveal">
            <div class="hero-panel">
                <img src="./assets/img/SurGOI.jpg" alt="SurGOI logo" class="hero-logo">
                <p id="hero-eyebrow" class="hero-eyebrow"></p>
                <h1 id="hero-title" class="hero-title"></h1>
                <p id="hero-subtitle" class="hero-subtitle"></p>
                <div class="lang-toggle" role="group" aria-label="Language switch">
                    <button type="button" class="lang-btn is-active" data-lang="nl" aria-pressed="true">NL</button>
                    <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
                </div>
            </div>
        </section>

        <section id="featured-section" class="section reveal">
            <div class="section-head">
                <h2 id="featured-title" class="section-title"></h2>
                <p id="featured-subtitle" class="section-subtitle"></p>
            </div>
            <p id="featured-empty" class="section-note hidden"></p>
            <div id="featured-grid" class="cards-grid featured-grid"></div>
        </section>

        <section id="all-modpacks-section" class="section reveal">
            <div class="section-head">
                <h2 id="all-modpacks-title" class="section-title"></h2>
                <p id="all-modpacks-subtitle" class="section-subtitle"></p>
            </div>

            <div class="filters-panel" aria-label="Modpack filters">
                <label class="filter-field" for="search-input">
                    <span id="search-label" class="filter-label"></span>
                    <input id="search-input" type="text" class="filter-input" autocomplete="off">
                </label>

                <div class="filter-field">
                    <span id="tag-label" class="filter-label"></span>
                    <div id="tag-chips" class="tag-chips" role="group" aria-label="Tag filters"></div>
                </div>

                <label class="filter-field" for="mc-version-select">
                    <span id="mc-version-label" class="filter-label"></span>
                    <select id="mc-version-select" class="filter-select"></select>
                </label>

                <label class="filter-field" for="status-select">
                    <span id="status-label" class="filter-label"></span>
                    <select id="status-select" class="filter-select"></select>
                </label>

                <div class="filter-actions">
                    <button id="clear-filters" type="button" class="ghost-btn"></button>
                </div>
            </div>

            <p id="results-count" class="results-count"></p>
            <p id="all-modpacks-empty" class="section-note hidden"></p>
            <div id="all-modpacks-grid" class="cards-grid"></div>
        </section>

        <section id="install-guide-section" class="section reveal">
            <div class="section-head">
                <h2 id="install-title" class="section-title"></h2>
                <p id="install-subtitle" class="section-subtitle"></p>
            </div>
            <p id="install-intro" class="install-intro"></p>
            <ol id="install-steps" class="install-steps"></ol>
            <div class="install-tips">
                <h3 id="install-tips-title" class="tips-title"></h3>
                <ul id="install-tips-list" class="tips-list"></ul>
            </div>
        </section>

        <section id="updates-section" class="section reveal">
            <div class="section-head">
                <h2 id="updates-title" class="section-title"></h2>
                <p id="updates-subtitle" class="section-subtitle"></p>
            </div>
            <p id="updates-empty" class="section-note hidden"></p>
            <div id="updates-list" class="updates-list"></div>
        </section>

        <section id="footer-cta-section" class="section footer-cta reveal">
            <h2 id="footer-title" class="section-title"></h2>
            <p id="footer-text" class="footer-text"></p>
            <a id="footer-button" class="cta-btn" target="_blank" rel="noopener noreferrer"></a>
            <p class="copyright"><span id="copyright-year"></span> <span id="copyright-text"></span></p>
        </section>
    </main>

    <script src="./assets/js/index.js"></script>
</body>
</html>
